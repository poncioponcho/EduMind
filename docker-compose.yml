version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_MCP_API_URL=http://localhost:8000
      - VITE_MCP_WS_URL=ws://localhost:8000/ws/events

  backend:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80
      - GIN_MODE=release

  mcp:
    build:
      context: ./edumind-mcp
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:80
    volumes:
      - mcp-plots:/app/assets/plots

volumes:
  mcp-plots:
