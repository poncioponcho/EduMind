version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
      - mcp
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_MCP_API_URL=http://localhost:3000/mcp-api
      - VITE_MCP_WS_URL=ws://localhost:3000/mcp-ws/events

  backend:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - GIN_MODE=release

  mcp:
    build:
      context: ./edumind-mcp
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
      - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    volumes:
      - mcp-plots:/app/assets/plots
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  mcp-plots:
