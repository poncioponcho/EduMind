version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started
      mcp:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_MCP_API_URL=http://localhost:8000
      - VITE_COGNITIVE_API_URL=http://localhost:8002
      - VITE_EVOLVE_API_URL=http://localhost:8003

  backend:
    build:
      context: ./backend/go
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
      - GIN_MODE=release

  mcp:
    build:
      context: ./edumind-mcp
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost:80
    volumes:
      - mcp-plots:/app/assets/plots
      - ./edumind-mcp/mcp_servers:/app/mcp_servers
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  cognitive:
    build:
      context: ./edumind-cognitive
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      - PYTHONPATH=/app:/app/edumind-mcp
      - COGNITIVE_PORT=8002

  evolve:
    build:
      context: ./edumind-evolve
      dockerfile: Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    depends_on:
      mcp:
        condition: service_healthy
    environment:
      - EVOLVE_PORT=8003
      - PYTHONPATH=/app:/app/edumind-mcp

volumes:
  mcp-plots:
