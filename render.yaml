services:
  - type: web
    name: edumind-api
    runtime: python
    buildCommand: pip install -r edumind-mcp/requirements.txt -r edumind-cognitive/requirements.txt -r edumind-evolve/requirements.txt
    startCommand: cd edumind-mcp && uvicorn api.server:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PYTHONPATH
        value: /opt/render/project/src:/opt/render/project/src/edumind-mcp
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: MOONSHOT_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: qwen
      - key: ALLOWED_ORIGINS
        value: "*"
