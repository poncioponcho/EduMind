<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduMind - Redirecting...</title>
  <script>
    // Single Page App redirect for GitHub Pages
    // When a user directly visits a sub-route (e.g., /EduMind/diagnosis),
    // GitHub Pages returns 404. This script redirects to the root with
    // the path preserved as a query parameter.
    var pathSegments = window.location.pathname.slice(1);
    var redirectUrl = window.location.origin + '/' + pathSegments.split('/')[0] + '/';
    var query = window.location.search || '';
    var hash = window.location.hash || '';
    var subPath = pathSegments.split('/').slice(1).join('/');
    if (subPath) {
      redirectUrl += '?redirect=' + encodeURIComponent('/' + subPath) + query.replace('?', '&') + hash;
    } else {
      redirectUrl += query + hash;
    }
    window.location.replace(redirectUrl);
  </script>
</head>
<body>
  <p>Redirecting to EduMind...</p>
</body>
</html>
